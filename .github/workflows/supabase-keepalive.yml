# Gói Free của Supabase tạm dừng project khi database có quá ít hoạt động trong 7 ngày.
# Mỗi ngày gọi hàm public.keepalive() (migration keepalive) bằng URL và khoá publishable trong
# .env.production; không cần secret. Lần chạy thất bại (project đã bị dừng, sai khoá) thì GitHub báo lỗi.
name: Giữ Supabase hoạt động

on:
  schedule:
    - cron: '17 2 * * *' # 09:17 giờ Việt Nam
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .env.production
          sparse-checkout-cone-mode: false
      - name: Gọi keepalive
        run: |
          set -euo pipefail
          set -a
          . ./.env.production
          set +a
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 10 \
            -X POST "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
