# Chạy toàn bộ kiểm tra trên mọi pull request và khi push lên master.
name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify
      # Output trong bài đọc phải khớp khi chạy lại (content-standard §5). Ghim đúng bản ghi trong `verified`
      # để số dòng của JDK trong stack trace không lệch; nâng JDK thì sửa cả đây lẫn `verified` của bài.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25.0.3'
      - run: pnpm content:run-code
